name: Build Flutter APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=OWM_KEY=${{ secrets.OWM_KEY }} --dart-define=WAQI_KEY=${{ secrets.WAQI_KEY }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sylph-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Build APK
        run: flutter build apk --release --dart-define=OWM_KEY=${{ secrets.OWM_KEY }} --dart-define=WAQI_KEY=${{ secrets.WAQI_KEY }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sylph-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
